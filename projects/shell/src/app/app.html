<a class="skip-link" href="#main">Saltar al contenido</a>
@if (session.user(); as user) {
  <header class="topbar">
    <span class="brand">Portal de Solicitudes</span>
    <nav aria-label="Principal">
      <a routerLink="/requests" routerLinkActive="active" ariaCurrentWhenActive="page">Solicitudes</a>
      @if (session.isApprover()) {
        <a routerLink="/approvals" routerLinkActive="active" ariaCurrentWhenActive="page">Aprobaciones</a>
      }
    </nav>
    <div class="user">
      <span>{{ user.name }} <small>({{ roleLabel() }})</small></span>
      <button type="button" class="ps-btn" (click)="logout()">Salir</button>
    </div>
  </header>
}
<main id="main" #main tabindex="-1">
  <router-outlet />
</main>
